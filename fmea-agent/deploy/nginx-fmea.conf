# FMEA Agent nginx 反向代理配置
# 用法: 复制到 /etc/nginx/conf.d/fmea.conf 后 nginx -t && reload
# 注意: 请将 server_name 改为实际域名或服务器 IP

server {
    listen 80;
    server_name fmea.example.com;   # ← 改为你的域名 / IP

    # SOR 文档、评分文件等大文件上传
    client_max_body_size 200m;

    # 静态资源缓存策略（前端改版后需 Ctrl+Shift+R 强刷）
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键: 项目初始化是 SSE 流式接口，必须关缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
